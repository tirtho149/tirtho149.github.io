name: update-projects

# Refreshes the "Code & Open Source" section from GitHub. Runs server-side, so
# the site stays current whether or not the laptop is on.
#
# Opt-in: a repo appears only once tagged with the `portfolio` topic.
# The hand-written Projects section is never touched — see scripts/render_projects.py.

on:
  # Safety net. 5 min is GitHub's floor and schedule is best-effort — runs get
  # delayed or dropped under load, so this is NOT a real-time mechanism.
  # 15 min keeps the site fresh without relying on punctuality.
  schedule:
    - cron: '*/15 * * * *'

  # Real-time path: any repo can fire this the instant you push. See
  # .github/templates/notify-portfolio.yml for the snippet to drop into a repo.
  # (Kept under .github/ so Pages never serves it — it contains ${{ }} syntax.)
  repository_dispatch:
    types: [portfolio-refresh]

  push:
    branches: [main]
    paths:
      - 'scripts/render_projects.py'
      - '.github/workflows/update-projects.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-projects
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Deliberately NOT the search API: it does not serve GITHUB_TOKEN and
      # answers with an HTML error page, which surfaces as the opaque
      # "invalid character '<' looking for beginning of value".
      # /users/{user}/repos is a plain public read that GITHUB_TOKEN can do,
      # and it already returns .topics. Filtering happens in Python so it can
      # be tested without pushing to CI.
      - name: Fetch repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp -X GET users/tirtho149/repos \
            -f per_page=100 -f type=owner > repos_raw.json
          echo "fetched $(python3 -c 'import json;d=json.load(open("repos_raw.json"));print(sum(len(p) for p in d) if d and isinstance(d[0],list) else len(d))') repo(s)"

      - name: Filter and render
        run: python3 scripts/render_projects.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html projects.json; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects.json
          # [skip ci] so this commit does not retrigger the workflow.
          git commit -m "chore: refresh Code & Open Source from GitHub [skip ci]"
          git push
